name: expense_tracker
description: "lightweight expense tracking mobile application that works offline"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  dio: ^5.9.0
  flutter:
    sdk: flutter
  # State management
  flutter_bloc: ^8.1.6
  # For adapting screen and font size.
  flutter_screenutil: ^5.9.3
  # Annotations for the freezed code-generator. This package does nothing without freezed too.
  freezed_annotation: ^2.4.4
  # Service locator (for dependency injection).
  get_it: ^9.1.0
  # Support JSON code generation  via the `json_serializable` package
  json_annotation: ^4.9.0
  pretty_dio_logger: ^1.4.0
  # Dio client generator.
  retrofit: ^4.0.1
  # Lightweight and blazing fast key-value database written in pure Dart
  hive: ^2.2.3
  # For working with paths
  path_provider: ^2.1.1
  # Image picker for receipt upload
  image_picker: ^1.0.4
  # For date formatting
  intl: ^0.18.1
  # For shared preferences
  shared_preferences: ^2.2.2
  # For generating unique IDs
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.9
  retrofit_generator: ^8.2.1
  # Freezed code generator for unions/sealed classes
  freezed: ^2.5.7
  # For Hive code generation
  hive_generator: ^2.0.1
  # For testing blocs
  bloc_test: ^9.1.7
  # For mocking dependencies
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
